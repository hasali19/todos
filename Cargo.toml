[package]
name = "todos"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
color-eyre = "0.6.5"
eyre = "0.6.14"
jiff = { version = "0.2.38", features = ["serde"] }
jiff-sqlx = { version = "0.2.0", features = ["sqlite"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
